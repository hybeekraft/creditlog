<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf6ea">
  <title>Admin sign in · CreditLog</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fbf6ea; }
    .login-card { width: min(100%, 440px); padding: 36px; border: 1px solid rgba(25,13,8,.12); border-radius: 22px; background: #fff; box-shadow: 0 18px 60px rgba(25,13,8,.1); }
    .login-card h1 { margin: 0 0 8px; color: #190d08; font-size: 28px; }
    .login-card p { color: #705e51; line-height: 1.55; }
    .login-card label { display: block; margin: 18px 0 6px; color: #45352b; font-weight: 700; }
    .login-card input { box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid rgba(25,13,8,.2); border-radius: 10px; font: inherit; }
    .login-card button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 10px; color: white; background: #d04515; font: inherit; font-weight: 800; cursor: pointer; }
    #loginError { min-height: 1.4em; color: #b42318; }
  </style>
</head>
<body>
  <main class="login-card">
    <a href="/" style="color:#d04515;font-weight:800;text-decoration:none">CreditLog</a>
    <h1>Admin sign in</h1>
    <p>Use the administrator account configured on the CreditLog bot backend.</p>
    <form id="adminLoginForm">
      <label for="username">Email</label>
      <input id="username" name="username" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="loginError" role="alert"></p>
      <button type="submit">Sign in securely</button>
    </form>
  </main>
  <script src="/shared.js"></script>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('loginError');
      const button = event.currentTarget.querySelector('button');
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        const result = await response.json();
        if (!response.ok || !result.success || !result.token) throw new Error(result.message || 'Sign in failed.');
        localStorage.setItem('creditlog_admin_token', result.token);
        setCurrentUser(result.user);
        const requested = new URLSearchParams(location.search).get('next') || 'admin.html';
        const allowed = ['admin.html', 'inventory.html', 'customers.html', 'settings.html', 'activity-logs.html', 'orders.html'];
        location.replace(allowed.includes(requested.split('?')[0]) ? requested : 'admin.html');
      } catch (err) {
        error.textContent = err.message || 'Unable to sign in. Check your connection and try again.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
