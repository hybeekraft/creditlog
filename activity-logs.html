<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="System audit trail, security logs, and action history.">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

<body>
  <div class="dashboard-layout admin-layout">
    <!-- Admin Sidebar -->

      <a href="index.html" class="dash-brand">
        <div class="logo-icon small" style="color: #D04515;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"/>
          </svg>
        </div>
        <span class="logo-text">Credit<span class="accent-text" style="color: #D04515;">Log</span></span>
      </a>

      <nav class="dash-menu">
        <a href="inventory.html" class="menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          Inventory & CMS
        </a>
        <a href="admin.html#orders" class="menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Orders
        </a>
        <a href="activity-logs.html" class="menu-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Activity Logs
        </a>
        <a href="customers.html" class="menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          Customers
        </a>
        <a href="settings.html" class="menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          Settings
        </a>
      </nav>
    </aside>

    <!-- Logs Main Content -->
    <main class="dash-main-area">
      <header class="dash-top-bar">
        <div>
          <h1 class="welcome-heading">Activity Logs</h1>
          <p class="welcome-sub">Track all important actions and changes in your system.</p>
        </div>
        <div style="display: flex; align-items: center; gap: 14px;">
          <div class="user-profile-badge" id="adminUserBadge">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Admin" class="avatar-img-sm" loading="lazy" decoding="async">
            <div>
              <div class="badge-name" id="adminProfileName">Admin Manager</div>
              <div class="badge-tag">Admin</div>
            </div>
          </div>
          <button class="secondary-btn" onclick="logoutUser()" style="padding: 7px 12px; font-size: 12px; display: flex; align-items: center; gap: 6px;" title="Sign out of Admin Portal">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Sign Out</span>
          </button>
        </div>
      </header>

      <!-- Filter Toolbar Bar -->
      <div class="logs-toolbar-card">
        <div class="filters-row">
          <div class="filter-select-box">
            <select id="filterUser" onchange="renderLogs()">
              <option value="all">All Users</option>
              <option value="Admin">Admin</option>
              <option value="Customer">Customer</option>
            </select>
          </div>

          <div class="filter-select-box">
            <select id="filterModule" onchange="renderLogs()">
              <option value="all">All Modules</option>
              <option value="Products">Products</option>
              <option value="Orders">Orders</option>
              <option value="Discounts">Discounts</option>
              <option value="Auth">Auth</option>
            </select>
          </div>

          <div class="filter-select-box">
            <select id="filterAction" onchange="renderLogs()">
              <option value="all">All Actions</option>
              <option value="Updated product price">Updated product price</option>
              <option value="Purchased subscription">Purchased subscription</option>
              <option value="Updated discount">Updated discount</option>
              <option value="Added new product">Added new product</option>
              <option value="Logged in">Logged in</option>
              <option value="Changed order status">Changed order status</option>
            </select>
          </div>

          <div class="date-range-badge">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" /></svg>
            <span>Sep 1, 2026 - Sep 16, 2026</span>
          </div>

          <button class="primary-btn export-btn" onclick="exportLogsToCSV()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
            Export
          </button>
        </div>
      </div>

      <!-- Activity Logs Table -->
      <div class="dash-table-card logs-table-card">
        <div class="table-responsive">
          <table class="data-table" id="activityLogsTable">
            <thead>
              <tr>
                <th>Date & Time</th>
                <th>User</th>
                <th>Action</th>
                <th>Module</th>
                <th>Record ID</th>
                <th>IP Address</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="activityLogsBody">
              <!-- Dynamically rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/shared.js"></script>
  <script>
    const LOGS = [
      { time: '15 Sep 2026 14:32', user: 'Admin', userRole: 'admin', action: 'Updated product price', module: 'Products', recordId: 'PRD-102', ip: '102.89.12.34', status: 'Success' },
      { time: '15 Sep 2026 13:21', user: 'Customer', userRole: 'cust', action: 'Purchased subscription', module: 'Orders', recordId: 'ORD-10482', ip: '197.210.45.67', status: 'Success' },
      { time: '14 Sep 2026 17:48', user: 'Admin', userRole: 'admin', action: 'Updated discount', module: 'Discounts', recordId: 'DISC-07', ip: '102.89.12.34', status: 'Success' },
      { time: '14 Sep 2026 11:16', user: 'Admin', userRole: 'admin', action: 'Added new product', module: 'Products', recordId: 'PRD-103', ip: '102.89.12.34', status: 'Success' },
      { time: '13 Sep 2026 09:03', user: 'Customer', userRole: 'cust', action: 'Logged in', module: 'Auth', recordId: '-', ip: '197.210.45.67', status: 'Success' },
      { time: '12 Sep 2026 16:27', user: 'Admin', userRole: 'admin', action: 'Changed order status', module: 'Orders', recordId: 'ORD-10467', ip: '102.89.12.34', status: 'Success' },
      { time: '12 Sep 2026 14:32', user: 'Customer', userRole: 'cust', action: 'Purchased subscription', module: 'Orders', recordId: 'ORD-10461', ip: '197.210.45.67', status: 'Success' },
      { time: '10 Sep 2026 18:14', user: 'Admin', userRole: 'admin', action: 'Updated product price', module: 'Products', recordId: 'PRD-101', ip: '102.89.12.34', status: 'Success' }
    ];

    function renderLogs() {
      const userFilter = document.getElementById('filterUser')?.value || 'all';
      const moduleFilter = document.getElementById('filterModule')?.value || 'all';
      const actionFilter = document.getElementById('filterAction')?.value || 'all';

      const tbody = document.getElementById('activityLogsBody');
      if (!tbody) return;

      tbody.innerHTML = '';
      const filtered = LOGS.filter(log => {
        const matchesUser = userFilter === 'all' || log.user === userFilter;
        const matchesModule = moduleFilter === 'all' || log.module === moduleFilter;
        const matchesAction = actionFilter === 'all' || log.action === actionFilter;
        return matchesUser && matchesModule && matchesAction;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:30px; color:var(--text-muted);">No logs found matching current filters.</td></tr>`;
        return;
      }

      filtered.forEach(log => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${log.time}</td>
          <td><span class="${log.userRole === 'admin' ? 'user-tag-admin' : 'user-tag-cust'}">${log.user}</span></td>
          <td>${log.action}</td>
          <td>${log.module}</td>
          <td><code>${log.recordId}</code></td>
          <td>${log.ip}</td>
          <td><span class="status-badge-success">${log.status}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportLogsToCSV() {
      const headers = ['Date & Time', 'User', 'Action', 'Module', 'Record ID', 'IP Address', 'Status'];
      const rows = LOGS.map(l => [
        `"${l.time}"`,
        `"${l.user}"`,
        `"${l.action}"`,
        `"${l.module}"`,
        `"${l.recordId}"`,
        `"${l.ip}"`,
        `"${l.status}"`
      ]);

      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `creditlog_activity_logs_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      showToast('Activity logs exported to CSV!');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderLogs();
      const user = getCurrentUser();
      if (user && user.name) {
        const el = document.getElementById('adminProfileName');
        if (el) el.textContent = user.name;
      }
    });
  </script>
</body>
</html>
