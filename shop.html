<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Subscriptions — CreditLog</title>
  <meta name="description"
    content="Browse verified digital subscriptions. Compare pricing, durations, and buy directly with automated instant dispatch.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .shop-page-header {
      padding: 48px 24px 24px;
      max-width: 1240px;
      margin: 0 auto;
      text-align: center;
    }

  </style>
</head>

<body>

  <!-- Global Main Navigation -->
  <header class="site-header" id="siteHeader">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon" style="color: #A63C06;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z" />
          </svg>
        </div>
        <span class="logo-text">Credit<span class="accent-text">Log</span></span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link active">Shop</a>
      </nav>

      <div class="header-actions">
        <a href="https://wa.me/message/creditlog" target="_blank" rel="noopener" class="hero-btn-outline" style="padding: 7px 16px; font-size: 13px; text-decoration: none; border-radius: 9999px; display: inline-flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <span>24/7 Support</span>
        </a>
      </div>
    </div>
  </header>

  <!-- SHOP MAIN CONTENT -->
  <main class="main-content">
    
    <div class="shop-page-header">

      <h1 class="hero-title" style="font-size: clamp(32px, 5vw, 48px); margin-bottom: 10px;">
        Subscriptions Shop
      </h1>
      <p class="hero-subtitle" style="margin-bottom: 24px;">
        Verified digital subscriptions across AI, Design, Streaming, and Productivity with instant direct dispatch.
      </p>
    </div>

    <!-- Shop Section with Grid/List -->
    <section class="catalog-section" id="catalogSection" style="padding-top: 10px;">
      <!-- Dynamic Apple Segmented Category Navigation -->
      <div class="category-nav-wrapper">
        <div class="category-segmented-bar" id="categorySegmentedBar">
          <button class="category-pill-btn active" data-cat="all" onclick="filterCategory('all', this)">
            <span>All Tools</span>
            <span class="category-pill-badge" id="badgeAll"></span>
          </button>
          <button class="category-pill-btn" data-cat="ai" onclick="filterCategory('ai', this)">
            <span>AI & LLMs</span>
            <span class="category-pill-badge" id="badgeAi">0</span>
          </button>
          <button class="category-pill-btn" data-cat="design" onclick="filterCategory('design', this)">
            <span>Design & Studio</span>
            <span class="category-pill-badge" id="badgeDesign">0</span>
          </button>
          <button class="category-pill-btn" data-cat="learning_prod" onclick="filterCategory('learning_prod', this)">
            <span>Productivity</span>
            <span class="category-pill-badge" id="badgeProd">0</span>
          </button>
          <button class="category-pill-btn" data-cat="streaming_gaming" onclick="filterCategory('streaming_gaming', this)">
            <span>Entertainment</span>
            <span class="category-pill-badge" id="badgeEnt">0</span>
          </button>
          <button class="category-pill-btn" data-cat="security" onclick="filterCategory('security', this)">
            <span>Security & VPN</span>
            <span class="category-pill-badge" id="badgeSec">0</span>
          </button>
        </div>
      </div>

      <!-- Dynamic Controls Row: Search, Sort, and View Mode Toggle -->
      <div class="catalog-controls-row">
        <!-- Fast Search Bar -->
        <div class="catalog-search-wrap">
          <svg class="catalog-search-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
              clip-rule="evenodd" />
          </svg>
          <input type="text" id="catalogSearchInput" class="catalog-search-input"
            placeholder="Search subscriptions (e.g. ChatGPT, Netflix, Canva)..." oninput="handleSearch(this.value)">
          <span class="catalog-search-shortcut">/</span>
        </div>
        <div class="catalog-controls-right">
          <!-- Apple Glassmorphic Sort Dropdown -->
          <div class="apple-dropdown-wrap" id="sortDropdownWrap">
            <button type="button" class="apple-sort-trigger" id="sortDropdownTrigger" onclick="toggleSortMenu(event)" aria-haspopup="true" aria-expanded="false">
              <span class="sort-icon-prefix">⇅</span>
              <span id="sortDropdownLabel">Featured First</span>
              <svg class="sort-chevron-icon" width="12" height="12" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
              </svg>
            </button>
            <div class="apple-dropdown-menu hidden" id="sortDropdownMenu" role="menu">
              <button type="button" class="apple-dropdown-item active" data-sort="featured" onclick="selectSortOption('featured', 'Featured First')">
                <span>Featured First</span>
                <span class="sort-check">✓</span>
              </button>
              <button type="button" class="apple-dropdown-item" data-sort="price-asc" onclick="selectSortOption('price-asc', 'Price: Lowest to Highest')">
                <span>Price: Lowest to Highest</span>
                <span class="sort-check">✓</span>
              </button>
              <button type="button" class="apple-dropdown-item" data-sort="price-desc" onclick="selectSortOption('price-desc', 'Price: Highest to Lowest')">
                <span>Price: Highest to Lowest</span>
                <span class="sort-check">✓</span>
              </button>
              <button type="button" class="apple-dropdown-item" data-sort="name-asc" onclick="selectSortOption('name-asc', 'Alphabetical: A to Z')">
                <span>Alphabetical: A to Z</span>
                <span class="sort-check">✓</span>
              </button>
            </div>
          </div>
          <div class="view-mode-toggle" id="viewModeToggle">
            <button type="button" class="view-mode-btn active" id="viewModeGrid" onclick="setViewMode('grid')" title="Bento Grid View">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <rect x="1" y="1" width="6" height="6" rx="1.5" />
                <rect x="9" y="1" width="6" height="6" rx="1.5" />
                <rect x="1" y="9" width="6" height="6" rx="1.5" />
                <rect x="9" y="9" width="6" height="6" rx="1.5" />
              </svg>
              <span>Grid</span>
            </button>
            <button type="button" class="view-mode-btn" id="viewModeList" onclick="setViewMode('list')" title="Compact List View">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <rect x="1" y="2" width="14" height="2.5" rx="1" />
                <rect x="1" y="6.75" width="14" height="2.5" rx="1" />
                <rect x="1" y="11.5" width="14" height="2.5" rx="1" />
              </svg>
              <span>List</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Live Directory Container -->
      <div class="directory-grid" id="directoryGrid">
        <!-- Rendered via JS -->
      </div>

      <!-- Pagination Container (From Uiverse.io by uiverse-astronaut) -->
      <div class="catalog-pagination-wrap" id="catalogPaginationWrap">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- Minimal Clean Footer -->
    <footer class="site-footer-minimal">
      <div class="footer-minimal-container">
        <div class="footer-minimal-left">
          <a href="index.html" class="footer-brand-link">
            <div class="logo-icon small" style="color: #EEBA0B;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"/>
              </svg>
            </div>
            <span class="logo-text" style="font-size: 16px; font-weight: 700; color: #FFFFFF;">Credit<span class="accent-text" style="color: #EEBA0B;">Log</span></span>
          </a>
          <span class="footer-copyright">&copy; 2026 CreditLog. All rights reserved.</span>
        </div>

        <nav class="footer-minimal-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="shop.html#catalogSection">All Plans</a>
          <a href="index.html#faqSection">FAQ</a>
          <a href="admin.html">Admin</a>
        </nav>

        <div class="footer-minimal-socials">
          <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>
          <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/>
            </svg>
          </a>
          <a href="https://x.com" target="_blank" rel="noopener noreferrer" aria-label="X">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
        </div>
      </div>
    </footer>
  </main>

  <script src="shared.js"></script>
  <script>
    // State Management
    let currentCategory = 'all';
    let currentSearch = '';
    let currentSortMode = 'featured';
    let currentViewMode = 'grid';
    let currentPage = 1;
    const PAGE_SIZE = 20;

    // Global Key Listener for Quick Search (/)
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        const searchInput = document.getElementById('catalogSearchInput');
        if (searchInput) {
          searchInput.focus();
          searchInput.select();
        }
      }
    });

    // Helper: Category and Search Filter
    function getFilteredProducts() {
      const source = (typeof getAllCatalogProducts === 'function') ? getAllCatalogProducts() : ((typeof CATALOG_PRODUCTS !== 'undefined') ? CATALOG_PRODUCTS : []);
      return source.filter(prod => {
        let matchesCat = true;
        if (currentCategory === 'instock') {
          matchesCat = prod.inStock === true;
        } else if (currentCategory === 'soldout') {
          matchesCat = prod.inStock === false;
        } else if (currentCategory === 'ai') {
          matchesCat = prod.category === 'ai';
        } else if (currentCategory === 'design') {
          matchesCat = prod.category === 'design';
        } else if (currentCategory === 'learning_prod') {
          matchesCat = prod.category === 'learning' || prod.category === 'productivity';
        } else if (currentCategory === 'streaming_gaming') {
          matchesCat = prod.category === 'streaming' || prod.category === 'gaming' || prod.category === 'social';
        } else if (currentCategory === 'security') {
          matchesCat = prod.category === 'security';
        } else if (currentCategory !== 'all') {
          matchesCat = prod.category === currentCategory;
        }

        const q = currentSearch.toLowerCase().trim();
        const matchesSearch = !q ||
          prod.name.toLowerCase().includes(q) ||
          (prod.brand && prod.brand.toLowerCase().includes(q)) ||
          (prod.description && prod.description.toLowerCase().includes(q)) ||
          (prod.duration && prod.duration.toLowerCase().includes(q));

        return matchesCat && matchesSearch;
      });
    }

    // Sorting Helper
    function getSortedProducts(products) {
      const copy = [...products];
      if (currentSortMode === 'price-asc') {
        copy.sort((a, b) => (a.usdPrice || 0) - (b.usdPrice || 0));
      } else if (currentSortMode === 'price-desc') {
        copy.sort((a, b) => (b.usdPrice || 0) - (a.usdPrice || 0));
      } else if (currentSortMode === 'name-asc') {
        copy.sort((a, b) => a.name.localeCompare(b.name));
      }
      return copy;
    }

    // Update Category Badges
    function updateCategoryBadges() {
      const source = (typeof getAllCatalogProducts === 'function') ? getAllCatalogProducts() : ((typeof CATALOG_PRODUCTS !== 'undefined') ? CATALOG_PRODUCTS : []);
      const allCount = source.length;
      const aiCount = source.filter(p => p.category === 'ai').length;
      const designCount = source.filter(p => p.category === 'design').length;
      const prodCount = source.filter(p => p.category === 'learning' || p.category === 'productivity').length;
      const entCount = source.filter(p => p.category === 'streaming' || p.category === 'gaming' || p.category === 'social').length;
      const secCount = source.filter(p => p.category === 'security').length;

      const setBadge = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
      };

      setBadge('badgeAll', allCount);
      setBadge('badgeAi', aiCount);
      setBadge('badgeDesign', designCount);
      setBadge('badgeProd', prodCount);
      setBadge('badgeEnt', entCount);
      setBadge('badgeSec', secCount);
    }

    // Direct Navigation to Product Detail Page
    function navigateToProduct(prodId) {
      if (!prodId) return;
      window.location.href = `product.html?id=${encodeURIComponent(prodId)}`;
    }

    // Render Function: Renders each product individually with pagination (max 20 per page)
    function renderCatalog() {
      const filtered = getFilteredProducts();
      const sortedProducts = getSortedProducts(filtered);
      const container = document.getElementById('directoryGrid');
      const paginationWrap = document.getElementById('catalogPaginationWrap');
      if (!container) return;

      container.innerHTML = '';

      const totalItems = sortedProducts.length;
      const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;

      // Clamp currentPage
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;


      if (totalItems === 0) {
        if (paginationWrap) paginationWrap.innerHTML = '';
        container.className = 'directory-grid';
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 72px 20px; background: rgba(18, 9, 5, 0.02); border-radius: 20px; border: 1px dashed rgba(18, 9, 5, 0.12);">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(166, 60, 6, 0.08); border: 1px solid rgba(166, 60, 6, 0.2); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: #A63C06;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <div style="font-size: 17px; font-weight: 700; color: #120905; margin-bottom: 6px;">No subscriptions match your query</div>
            <div style="font-size: 13.5px; color: var(--text-muted); max-width: 400px; margin: 0 auto 18px;">Try clearing your search terms or picking another category tab above.</div>
            <button onclick="clearSearchAndReset()" class="primary-btn" style="padding: 9px 20px; font-size: 13px;">View All Subscriptions</button>
          </div>
        `;
        return;
      }

      // Slice to 20 items per page
      const pageProducts = sortedProducts.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      if (currentViewMode === 'grid') {
        container.className = 'directory-grid';
        pageProducts.forEach((prod, idx) => {
          const formattedPrice = formatPrice(prod.usdPrice);
          const formattedDual = formatDualPrice(prod.usdPrice);
          const catLabel = (prod.category || 'APP').toUpperCase();
          const inStock = prod.inStock !== false;

          const card = document.createElement('div');
          card.className = 'directory-card';
          card.style.setProperty('--card-index', idx);
          card.onclick = () => navigateToProduct(prod.id);

          card.innerHTML = `
            <div class="card-header-row">
              ${renderBrandIcon(prod)}
              <div style="display: flex; align-items: center; gap: 6px;">
                <span class="card-cat-badge">${catLabel}</span>
                ${inStock ? `<span class="card-stock-pill in-stock">● ${prod.availableStock !== undefined ? prod.availableStock + ' in Stock' : 'In Stock'}</span>` : '<span class="card-stock-pill sold-out">✖ Out of Stock</span>'}
              </div>
            </div>

            <div class="card-title-group" style="margin-bottom: 12px;">
              <h3 class="directory-item-title" style="font-size: 16.5px; font-weight: 700; color: #120905; margin-bottom: 4px; line-height: 1.35;">${prod.name}</h3>
              <div class="card-duration-badge" style="display: inline-flex; align-items: center; font-size: 12px; color: #C36F09; font-weight: 600; margin-bottom: 6px;">
                <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor" style="color: #C36F09; margin-right: 4px;"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
                <span>${prod.duration || 'Standard License'}</span>
              </div>
              <p class="directory-item-desc" style="font-size: 13px; color: #6B625B; line-height: 1.45; min-height: 38px; margin: 0;">${prod.description || 'Verified private digital subscription with instant delivery.'}</p>
            </div>

            <div class="card-pricing-footer" style="display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid rgba(18, 9, 5, 0.08); margin-top: auto;">
              <div class="price-val-box">
                <span class="directory-price-val" style="font-size: 18px; font-weight: 800; color: #120905; display: block; font-variant-numeric: tabular-nums;">${formattedPrice}</span>
                <span class="directory-price-sub" style="font-size: 11px; color: #15803D; font-weight: 600;">Instant Delivery</span>
              </div>
              <div style="display: flex; gap: 6px;">
                <button type="button" class="preview-buy-btn" style="padding: 7px 12px; font-size: 11.5px;" onclick="event.stopPropagation(); openQuickViewModal('${prod.id}')">
                  <span>Quick View</span>
                </button>
                <button type="button" class="directory-select-btn" ${!inStock ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''} onclick="event.stopPropagation(); ${inStock ? `navigateToProduct('${prod.id}')` : ''}">
                  <span>${inStock ? 'Buy Now →' : 'Sold Out'}</span>
                </button>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } else {
        container.className = 'directory-list-view';
        pageProducts.forEach((prod, idx) => {
          const formattedPrice = formatPrice(prod.usdPrice);
          const formattedDual = formatDualPrice(prod.usdPrice);
          const catLabel = (prod.category || 'APP').toUpperCase();

          const row = document.createElement('div');
          row.className = 'directory-list-row';
          row.onclick = () => navigateToProduct(prod.id);

          row.innerHTML = `
            <div class="list-row-left">
              ${renderBrandIcon(prod)}
              <div>
                <div class="directory-item-title" style="font-size: 15px; font-weight: 700; color: #120905; margin-bottom: 2px;">${prod.name}</div>
                <div style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px;">
                  <span style="color: #C36F09; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
                    <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
                    ${prod.duration || '1 Month'}
                  </span>
                  <span>·</span>
                  <span>${catLabel}</span>
                  <span>·</span>
                  <span>${prod.inStock !== false ? '● In Stock' : '● Sold Out'}</span>
                </div>
              </div>
            </div>

            <div class="list-row-right" style="display: flex; align-items: center; gap: 16px;">
              <div style="text-align: right;">
                <span style="font-size: 16px; font-weight: 800; color: #120905; display: block;">${formattedPrice}</span>
                <span style="font-size: 11px; color: #15803D; font-weight: 600;">Instant Delivery</span>
              </div>
              <button type="button" class="directory-select-btn" onclick="event.stopPropagation(); navigateToProduct('${prod.id}')" style="padding: 7px 14px; font-size: 12.5px;">
                <span>Buy Now →</span>
              </button>
            </div>
          `;
          container.appendChild(row);
        });
      }

      renderPagination(totalPages);
    }

    // Render Apple-Grade Pagination (From Uiverse.io by uiverse-astronaut)
    function renderPagination(totalPages) {
      const wrap = document.getElementById('catalogPaginationWrap');
      if (!wrap) return;

      if (totalPages <= 1) {
        wrap.innerHTML = '';
        return;
      }

      const items = getPaginationItems(currentPage, totalPages);
      let html = `<nav class="cir-page" aria-label="Pagination">`;

      // Previous page button (only shown when currentPage > 1 matching inspo)
      if (currentPage > 1) {
        html += `
          <button class="cir-page__nav" type="button" aria-label="Previous page" onclick="goToPage(${currentPage - 1})">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
        `;
      }

      // Page numbers & Ellipsis gaps
      items.forEach(item => {
        if (item === '...') {
          html += `<span class="cir-page__gap" aria-hidden="true">…</span>`;
        } else if (item === currentPage) {
          html += `
            <button class="cir-page__num cir-page__num--active" type="button" aria-current="page">
              ${item}
            </button>
          `;
        } else {
          html += `
            <button class="cir-page__num" type="button" onclick="goToPage(${item})">
              ${item}
            </button>
          `;
        }
      });

      // Next page button (only shown when currentPage < totalPages matching inspo)
      if (currentPage < totalPages) {
        html += `
          <button class="cir-page__nav" type="button" aria-label="Next page" onclick="goToPage(${currentPage + 1})">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        `;
      }

      html += `</nav>`;
      wrap.innerHTML = html;
    }

    // Helper: Smart Pagination Range Algorithm
    function getPaginationItems(current, total) {
      if (total <= 7) {
        return Array.from({ length: total }, (_, i) => i + 1);
      }
      if (current <= 4) {
        return [1, 2, 3, 4, 5, '...', total];
      }
      if (current >= total - 3) {
        return [1, '...', total - 4, total - 3, total - 2, total - 1, total];
      }
      return [1, '...', current - 1, current, current + 1, '...', total];
    }

    // Go to specific page
    function goToPage(page) {
      const filtered = getFilteredProducts();
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
      if (page < 1 || page > totalPages || page === currentPage) return;
      currentPage = page;
      renderCatalog();
      const catSection = document.getElementById('catalogSection');
      if (catSection) {
        catSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      if (typeof initCardSpotlights === 'function') {
        initCardSpotlights();
      }
    }

    // Set View Mode (Grid vs List)
    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('viewModeGrid').classList.toggle('active', mode === 'grid');
      document.getElementById('viewModeList').classList.toggle('active', mode === 'list');
      renderCatalog();
    }

    // Custom Apple Dropdown Control
    function toggleSortMenu(event) {
      if (event) event.stopPropagation();
      const menu = document.getElementById('sortDropdownMenu');
      const trigger = document.getElementById('sortDropdownTrigger');
      if (!menu || !trigger) return;
      const isHidden = menu.classList.contains('hidden');
      menu.classList.toggle('hidden', !isHidden);
      trigger.classList.toggle('active', isHidden);
      trigger.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
    }

    function selectSortOption(sortVal, label) {
      currentSortMode = sortVal;
      currentPage = 1;
      const labelEl = document.getElementById('sortDropdownLabel');
      if (labelEl) labelEl.textContent = label;
      document.querySelectorAll('#sortDropdownMenu .apple-dropdown-item').forEach(item => {
        item.classList.toggle('active', item.getAttribute('data-sort') === sortVal);
      });
      const menu = document.getElementById('sortDropdownMenu');
      const trigger = document.getElementById('sortDropdownTrigger');
      if (menu) menu.classList.add('hidden');
      if (trigger) {
        trigger.classList.remove('active');
        trigger.setAttribute('aria-expanded', 'false');
      }
      renderCatalog();
    }

    // Close on outside click or Escape
    document.addEventListener('click', (e) => {
      const wrap = document.getElementById('sortDropdownWrap');
      if (wrap && !wrap.contains(e.target)) {
        const menu = document.getElementById('sortDropdownMenu');
        const trigger = document.getElementById('sortDropdownTrigger');
        if (menu && !menu.classList.contains('hidden')) {
          menu.classList.add('hidden');
          if (trigger) {
            trigger.classList.remove('active');
            trigger.setAttribute('aria-expanded', 'false');
          }
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const menu = document.getElementById('sortDropdownMenu');
        const trigger = document.getElementById('sortDropdownTrigger');
        if (menu && !menu.classList.contains('hidden')) {
          menu.classList.add('hidden');
          if (trigger) {
            trigger.classList.remove('active');
            trigger.setAttribute('aria-expanded', 'false');
          }
        }
      }
    });

    // Clear search helper
    function clearSearchAndReset() {
      currentSearch = '';
      currentCategory = 'all';
      currentPage = 1;
      const input = document.getElementById('catalogSearchInput');
      if (input) input.value = '';
      document.querySelectorAll('.category-pill-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-cat') === 'all');
      });
      renderCatalog();
    }

    // Filter by Category with Apple Sliding Pill Integration
    function filterCategory(cat, btnElem) {
      currentCategory = cat;
      currentPage = 1;
      const bar = document.getElementById('categorySegmentedBar');
      if (bar) {
        bar.querySelectorAll('.category-pill-btn').forEach(b => b.classList.remove('active'));
      }
      if (btnElem) {
        btnElem.classList.add('active');
      }
      renderCatalog();
      if (typeof initSegmentedSlidingPill === 'function' && bar) {
        initSegmentedSlidingPill(bar);
      }
      if (typeof initCardSpotlights === 'function') {
        initCardSpotlights();
      }
    }

    // Search Input
    function handleSearch(val) {
      currentSearch = val.trim();
      currentPage = 1;
      renderCatalog();
      if (typeof initCardSpotlights === 'function') {
        initCardSpotlights();
      }
    }

    // Robust Boot Function (handles both pre- and post-DOMContentLoaded states)
    async function bootCatalog() {
      updateCategoryBadges();
      renderCatalog();
      const bar = document.getElementById('categorySegmentedBar');
      if (typeof initSegmentedSlidingPill === 'function' && bar) {
        initSegmentedSlidingPill(bar);
      }
      if (typeof initCardSpotlights === 'function') {
        initCardSpotlights();
      }

      // Sync live inventory from server
      try {
        const res = await fetch('/api/products');
        if (res.ok) {
          const apiData = await res.json();
          if (apiData.success && Array.isArray(apiData.data)) {
            window.CATALOG_PRODUCTS = apiData.data;
            updateCategoryBadges();
            renderCatalog();
          }
        }
      } catch (err) {
        console.warn('Shop live sync fallback:', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootCatalog);
    } else {
      bootCatalog();
    }


  </script>
</body>

</html>
